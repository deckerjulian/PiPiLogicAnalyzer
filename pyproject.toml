[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipilogicanalyzer"
version = "7.1.0"
description = "Software and firmware for the RP2040/RP2350 logic analyzer, based on gusmanb's PiPiLogicAnalyzer"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Julian Decker" }]
keywords = ["logic analyzer", "sigrok", "protocol decoder", "rp2040", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.24",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-qt>=4.2", "ruff>=0.5"]

[project.scripts]
pipilogicanalyzer = "pipilogicanalyzer.app:main"

[project.gui-scripts]
pipilogicanalyzer-gui = "pipilogicanalyzer.app:main"

[project.urls]
Homepage = "https://github.com/deckerjulian/PiPiLogicAnalyzer"
Changelog = "https://github.com/deckerjulian/PiPiLogicAnalyzer/blob/main/CHANGELOG.md"
"Original PiPiLogicAnalyzer (gusmanb)" = "https://github.com/gusmanb/logicanalyzer"

[tool.setuptools.packages.find]
include = ["pipilogicanalyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:pipilogicanalyzer.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
