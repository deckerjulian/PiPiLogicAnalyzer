[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openscilab"
version = "0.1.0b1"
description = "Open measurement and control lab: instruments, flows, panels, reports, a logic analyzer and simulated instruments"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Julian Decker" }]
keywords = ["logic analyzer", "measurement", "lab", "flow", "simulator", "sigrok", "protocol decoder", "rp2040", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.24",
    "pyserial>=3.5",
    "pyusb>=1.2",
    "libusb-package>=1.0.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-qt>=4.2", "ruff>=0.5"]

[project.scripts]
openscilab = "openscilab.app:main"
openscilab-cli = "openscilab.cli:main"

[project.gui-scripts]
openscilab-gui = "openscilab.app:main"

[project.urls]
Homepage = "https://github.com/deckerjulian/openSciLab"
Documentation = "https://github.com/deckerjulian/openSciLab/wiki"
Changelog = "https://github.com/deckerjulian/openSciLab/blob/main/CHANGELOG.md"
"Original LogicAnalyzer (gusmanb)" = "https://github.com/gusmanb/logicanalyzer"

[tool.setuptools.packages.find]
include = ["openscilab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:openscilab.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
