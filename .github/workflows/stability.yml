# Stability checks on request (Actions -> Stability -> Run workflow):
#
# * soak: streams with a simulated Pico for some minutes while it watches the memory
#   (tests/test_soak.py);
# * crash hunt: several runners run the tests at the same time, each one or more rounds, with core
#   dumps on. A crash leaves the test it happened in (pytest -v), the Python stacks of every thread
#   (faulthandler) and the native ones (gdb on the core dump) in the log and in the artifact
#   "crash-logs-<runner>". A test that fails in a round fails the runner too (the slow runners find
#   what depends on timing).

name: Stability

on:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Soak test: minutes of streaming with a simulated Pico (0: none)"
        default: "30"
      crash_runners:
        description: "Crash hunt: how many runners run the tests at the same time (0: none)"
        default: "0"
      crash_rounds:
        description: "Crash hunt: how often each runner runs them"
        default: "1"
      crash_tests:
        description: "Crash hunt: the tests (pytest arguments)"
        default: "tests"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  soak:
    name: Soak test
    if: inputs.soak_minutes != '0'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the application
        run: python -m pip install -e ".[dev]"

      - name: Stream for ${{ inputs.soak_minutes }} minutes and watch the memory
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          OPENSCILAB_SOAK_MINUTES: ${{ inputs.soak_minutes }}
        run: python -m pytest -q -s -m soak tests/test_soak.py

  plan:
    name: Plan the crash hunt
    if: inputs.crash_runners != '0'
    runs-on: ubuntu-22.04
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - id: runners
        env:
          COUNT: ${{ inputs.crash_runners }}
        run: echo "runners=$(python3 -c 'import json, sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))' "$COUNT")" >> "$GITHUB_OUTPUT"

  crash-hunt:
    name: Crash hunt ${{ matrix.runner }}
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the Qt runtime libraries and gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 gdb

      - name: Install the application
        run: python -m pip install -e ".[dev]"

      - name: Let crashes leave a core dump
        run: |
          mkdir -p /tmp/cores
          chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p

      - name: Run the tests ${{ inputs.crash_rounds }} time(s)
        id: run
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          ROUNDS: ${{ inputs.crash_rounds }}
          TESTS: ${{ inputs.crash_tests }}
        run: |
          ulimit -c unlimited
          mkdir -p crash-logs
          crashed=0
          failed=0
          for round in $(seq 1 "$ROUNDS"); do
            log="crash-logs/round-$round.log"
            set +e
            # unbuffered: the name of the test that crashed is in the log, not lost in a buffer
            python -u -m pytest -v -p no:cacheprovider $TESTS > "$log" 2>&1
            code=$?
            set -e
            echo "Round $round: exit code $code; $(grep -E '^[0-9]+ (passed|failed)|^=+ .*(passed|failed)' "$log" | tail -n 1)"
            if [ "$code" -ge 128 ] || compgen -G "/tmp/cores/core.*" > /dev/null; then
              crashed=1
              echo "::error::Round $round crashed (exit code $code)"
              echo "The last tests that started:"
              grep -E "^tests/[^ ]+::" "$log" | tail -n 3
              echo
              grep -n "Fatal Python error" -A 80 "$log" | head -n 160 || true
              break
            fi
            if [ "$code" -ne 0 ]; then
              failed=1
              grep -E "^(FAILED|ERROR) " "$log" | tee -a "$GITHUB_STEP_SUMMARY" || true
            fi
          done
          echo "crashed=$crashed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: The native stacks of the crash
        if: steps.run.outputs.crashed == '1'
        run: |
          python_bin=$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')
          for core in /tmp/cores/core.*; do
            echo "=== $core"
            gdb -q -batch -ex "set pagination off" -ex "thread apply all bt 50" "$python_bin" "$core" 2>&1 \
              | tee -a crash-logs/native-stacks.txt | grep -v "^\[New LWP" | head -n 400
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs-${{ matrix.runner }}
          path: crash-logs/
          if-no-files-found: ignore

      - name: Fail when it crashed or a test failed
        if: steps.run.outputs.crashed == '1' || steps.run.outputs.failed == '1'
        run: |
          echo "::error::crashed: ${{ steps.run.outputs.crashed }}, a test failed: ${{ steps.run.outputs.failed }} (the log and the artifact have the details)"
          exit 1
