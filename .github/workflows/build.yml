# Tests, firmware for every board and ready-to-run application builds.
#
# To keep the builds short:
# * pull requests: tests only
# * push to main: tests, the application for Windows, macOS (Apple Silicon) and Linux, published
#   as the pre-release "latest-build". The Pico firmware is only rebuilt when firmware/ changed
#   since that release; otherwise its images are reused. The Arduino firmware and the bridge app
#   are built when their sources exist (firmware/arduino, firmware/bridge-android).
# * tag v* and manual runs (Actions -> Build -> Run workflow): everything, including the firmware
#   and macOS (Intel); a tag creates a release (a pre-release for alpha, beta and rc versions).
# A push that changes documentation alone starts no run; pull requests always run the tests.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".vscode/**", "firmware/*/.vscode/**"]
  # No paths-ignore here: a pull request that only changes documentation must still report the
  # "tests" check, otherwise it can never pass a required status check.
  pull_request:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Soak test: minutes of streaming with a simulated Pico (0: none)"
        default: "0"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Same versions as the Raspberry Pi Pico VS Code extension (firmware/pico/CMakeLists.txt).
  # build_all.sh finds the tools in ~/.pico-sdk, the directory layout of that extension.
  PICO_SDK_VERSION: "2.1.1"
  PICOTOOL_VERSION: "2.1.1"
  ARM_TOOLCHAIN_VERSION: "14.2.rel1"
  ARM_TOOLCHAIN_DIR: "14_2_Rel1"
  RELEASE_TAG: latest-build

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the application
        run: python -m pip install -e ".[dev]"

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"  # a crash (also when Python exits) shows where it happened
        run: python -m pytest -q --durations=15

  soak:
    name: Soak test
    if: github.event_name == 'workflow_dispatch' && inputs.soak_minutes != '0'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the application
        run: python -m pip install -e ".[dev]"

      - name: Stream for ${{ inputs.soak_minutes }} minutes and watch the memory
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          OPENSCILAB_SOAK_MINUTES: ${{ inputs.soak_minutes }}
        run: python -m pytest -q -s -m soak tests/test_soak.py

  plan:
    name: Plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      firmware: ${{ steps.plan.outputs.firmware }}
      arduino: ${{ steps.plan.outputs.arduino }}
      bridge: ${{ steps.plan.outputs.bridge }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tag of the last release is compared with this commit

      - name: Check the version of the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          package=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('openscilab/__init__.py').read()).group(1))")
          firmware=$(sed -n 's/^pico_set_program_version(openscilab_pico "\(.*\)")$/\1/p' firmware/pico/CMakeLists.txt)
          if [[ "$tag" != "$project" || "$tag" != "$package" || "$tag" != "$firmware" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml ($project), openscilab/__init__.py ($package) and firmware/pico/CMakeLists.txt ($firmware)"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$tag]'"
            exit 1
          fi

      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          firmware=true
          if [[ "$EVENT" == push && "$GITHUB_REF" == refs/heads/main ]] \
              && gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
              && git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null \
              && git diff --quiet "refs/tags/$RELEASE_TAG" "$GITHUB_SHA" -- firmware .github/workflows/build.yml; then
            firmware=false
          fi

          platforms='{"os":"windows-latest","platform":"windows-x64"},{"os":"macos-latest","platform":"macos-arm64"},{"os":"ubuntu-22.04","platform":"linux-x86_64"}'
          if [[ "$GITHUB_REF" == refs/tags/v* || "$EVENT" == workflow_dispatch ]]; then
            platforms="$platforms"',{"os":"macos-15-intel","platform":"macos-x64"}'
          fi

          # The Arduino firmware (phase 2) and the bridge app (phase 3) are built once they exist.
          arduino=false
          bridge=false
          if [[ -f firmware/arduino/platformio.ini ]]; then arduino=true; fi
          if [[ -f firmware/bridge-android/gradlew ]]; then bridge=true; fi

          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "arduino=$arduino" >> "$GITHUB_OUTPUT"
          echo "bridge=$bridge" >> "$GITHUB_OUTPUT"
          echo "platforms=[$platforms]" >> "$GITHUB_OUTPUT"
          {
            echo "### Build plan"
            echo "* Pico firmware: $([[ $firmware == true ]] && echo "built" || echo "reused from the release $RELEASE_TAG (firmware/ unchanged)")"
            echo "* Arduino firmware: $([[ $arduino == true ]] && echo "built" || echo "none yet")"
            echo "* Bridge app: $([[ $bridge == true ]] && echo "built" || echo "none yet")"
            echo "* Platforms: [$platforms]"
          } >> "$GITHUB_STEP_SUMMARY"

  firmware:
    name: Firmware ${{ matrix.board }}
    needs: plan
    if: needs.plan.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board:
          - BOARD_PICO
          - BOARD_PICO_2
          - BOARD_PICO_W
          - BOARD_PICO_W_WIFI
          - BOARD_PICO_2_W
          - BOARD_PICO_2_W_WIFI
          - BOARD_ZERO
          - BOARD_INTERCEPTOR
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Cache the ARM toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/.pico-sdk/toolchain/${{ env.ARM_TOOLCHAIN_DIR }}
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64

      - name: Download the ARM toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          target="$HOME/.pico-sdk/toolchain/$ARM_TOOLCHAIN_DIR"
          mkdir -p "$target"
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ --strip-components=1 -C "$target"

      - name: Cache the Pico SDK and picotool
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pico-sdk/sdk/${{ env.PICO_SDK_VERSION }}
            ~/.pico-sdk/picotool/${{ env.PICOTOOL_VERSION }}
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-picotool-${{ env.PICOTOOL_VERSION }}

      - name: Download the Pico SDK and build picotool
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdk="$HOME/.pico-sdk/sdk/$PICO_SDK_VERSION"
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk "$sdk"
          # cyw43-driver, lwip, ... for the Pico W boards
          git -C "$sdk" submodule update --init --depth 1

          source="$RUNNER_TEMP/picotool"
          git clone --depth 1 --branch "$PICOTOOL_VERSION" https://github.com/raspberrypi/picotool "$source"
          cmake -S "$source" -B "$source/build" -G Ninja \
            -DPICO_SDK_PATH="$sdk" \
            -DPICOTOOL_NO_LIBUSB=1 \
            -DPICOTOOL_FLAT_INSTALL=1 \
            -DCMAKE_INSTALL_PREFIX="$HOME/.pico-sdk/picotool/$PICOTOOL_VERSION"
          cmake --build "$source/build"
          cmake --install "$source/build"

      - name: Build ${{ matrix.board }}
        env:
          BOARD: ${{ matrix.board }}
        run: |
          # Without it the SDK downloads and builds picotool again for every image.
          export picotool_DIR="$HOME/.pico-sdk/picotool/$PICOTOOL_VERSION/picotool"
          firmware/build_all.sh --pico "$BOARD"

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: firmware/uf2/*.uf2
          if-no-files-found: error

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-log-${{ matrix.board }}
          path: firmware/uf2/*.log
          if-no-files-found: ignore

  firmware-host-tests:
    name: Firmware host tests (Pico)
    needs: plan
    if: needs.plan.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build and run
        run: |
          cmake -S firmware/pico/tests -B "$RUNNER_TEMP/pico-tests"
          cmake --build "$RUNNER_TEMP/pico-tests"
          ctest --test-dir "$RUNNER_TEMP/pico-tests" --output-on-failure

  firmware-arduino:
    name: Firmware Arduino
    needs: plan
    if: needs.plan.outputs.arduino == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/arduino/platformio.ini') }}

      - name: Native tests
        run: |
          python -m pip install platformio
          pio test -d firmware/arduino -e native

      - name: Build
        run: firmware/build_all.sh --arduino

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-arduino
          path: firmware/arduino-images/*
          if-no-files-found: error

  bridge-apk:
    name: Bridge app
    needs: plan
    if: needs.plan.outputs.bridge == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # (the default asks for the package "tools", which current command line tools no longer have)
          packages: platform-tools

      - name: JVM tests
        working-directory: firmware/bridge-android
        run: ./gradlew :core:test

      - name: Build
        run: firmware/build_all.sh --bridge

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: bridge-apk
          path: firmware/apk/openSciLab-bridge.apk
          if-no-files-found: error

  firmware-images:
    name: Firmware images
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - name: Combine the images of all boards
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware-uf2
          pattern: firmware-BOARD_*
          delete-merged: true

  app:
    name: App ${{ matrix.platform }}
    needs: [tests, plan, firmware-images]
    # Runs as well when the firmware was not rebuilt (firmware-images skipped).
    if: >-
      always()
      && needs.tests.result == 'success'
      && needs.plan.result == 'success'
      && (needs.firmware-images.result == 'success' || needs.firmware-images.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Determine the version
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${version}-dev.${GITHUB_SHA::7}"
          fi
          echo "ARTIFACT=openSciLab-${version}-${PLATFORM}" >> "$GITHUB_ENV"

      - name: Download the new firmware images
        if: needs.plan.outputs.firmware == 'true'
        uses: actions/download-artifact@v4
        with:
          name: firmware-uf2
          path: firmware/uf2

      - name: Reuse the firmware images of the last release
        if: needs.plan.outputs.firmware != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$RELEASE_TAG" --pattern "*.uf2" --dir firmware/uf2

      - name: Install the Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 file

      - name: Install the dependencies and PyInstaller
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10" pillow

      - name: Create the application icons
        run: python packaging/make_icons.py build/icons

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/openscilab.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Start the packaged application
        # (a packaged application that fails can wait for a click on an error message for ever)
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            Windows) executable="dist/openSciLab/openSciLab.exe" ;;
            macOS) executable="dist/openSciLab.app/Contents/MacOS/openSciLab" ;;
            *) executable="dist/openSciLab/openSciLab" ;;
          esac
          status=0
          "$executable" --smoke-test smoke-test.txt || status=$?
          cat smoke-test.txt || true
          exit $status

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/openSciLab -DestinationPath "dist/$env:ARTIFACT.zip"

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          # hdiutil occasionally reports "Resource busy" on the hosted runners
          for attempt in 1 2 3; do
            hdiutil create -volname openSciLab -srcfolder dist/openSciLab.app -ov -format UDZO "dist/${ARTIFACT}.dmg" && break
            sleep 5
          done
          test -f "dist/${ARTIFACT}.dmg"

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build_appimage.sh dist/openSciLab build/icons/openscilab-256.png "dist/${ARTIFACT}.AppImage"
          tar -C dist -czf "dist/${ARTIFACT}.tar.gz" openSciLab

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: [plan, app, firmware-arduino, bridge-apk]
    if: >-
      always()
      && needs.app.result == 'success'
      && needs.firmware-arduino.result != 'failure'
      && needs.bridge-apk.result != 'failure'
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            CHANGELOG.md
            LICENSE
            THIRD_PARTY_NOTICES.md
          sparse-checkout-cone-mode: false
          path: source

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Reuse the firmware images of the last release
        if: needs.plan.outputs.firmware != 'true'
        run: gh release download "$RELEASE_TAG" --pattern "*.uf2" --dir artifacts/firmware-uf2

      - name: Collect the files
        run: |
          mkdir upload
          find artifacts/app-* -type f -exec cp {} upload/ \;
          cp artifacts/firmware-uf2/*.uf2 upload/
          (cd artifacts/firmware-uf2 && zip -q ../../upload/openSciLab-firmware-pico-uf2.zip ./*.uf2)
          if [[ -d artifacts/firmware-arduino ]]; then
            (cd artifacts/firmware-arduino && zip -q ../../upload/openSciLab-firmware-arduino.zip ./*)
          fi
          if [[ -f artifacts/bridge-apk/openSciLab-bridge.apk ]]; then
            cp artifacts/bridge-apk/openSciLab-bridge.apk upload/
          fi
          cp source/LICENSE upload/LICENSE.txt
          cp source/THIRD_PARTY_NOTICES.md upload/
          (cd upload && sha256sum -- * > SHA256SUMS.txt)
          ls -l upload

      - name: Update the "latest-build" pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" upload/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (main, ${GITHUB_SHA::7})" \
            --notes "Automatic build of the newest commit on main (${GITHUB_SHA}): the firmware of the instruments and the application for Windows, macOS and Linux. Not a tested release."

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The notes are the section of this version in CHANGELOG.md.
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' source/CHANGELOG.md > release-notes.md
          printf '\n---\nBased on and extending the [LogicAnalyzer](https://github.com/gusmanb/logicanalyzer) by Agustín Giménez Bernad (gusmanb). Thank you!\n' >> release-notes.md
          # an alpha, beta or release candidate (0.1.0b1, 1.0.0rc2) is published as a pre-release
          prerelease=()
          if [[ "${GITHUB_REF_NAME#v}" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" upload/* \
            --title "openSciLab ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md "${prerelease[@]}"
