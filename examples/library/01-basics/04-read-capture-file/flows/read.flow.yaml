flow: Read a capture file
description: data.file_read reads data/demo.lac; convert.channel picks one channel of it.
nodes:
  file: {type: data.file_read, path: demo.lac, at: [0, 64]}
  scope: {type: view.scope, title: demo.lac, at: [272, 128]}
  channel: {type: convert.channel, channel: CLK, at: [272, 0]}
  frequency: {type: measure.frequency, at: [544, 0]}
  show: {type: view.number, title: Frequency of CLK, unit: Hz, at: [808, 0]}
edges:
  - file.capture -> scope.in
  - file.capture -> channel.in
  - channel.out -> frequency.in
  - frequency.out -> show.in
