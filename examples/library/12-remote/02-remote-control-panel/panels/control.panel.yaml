panel: Remote control panel
flow: ../flows/control.flow.yaml
width: 960
height: 496
widgets:
  heater: {kind: slider, bind: heater.value, title: Heating power, x: 16, y: 16, width: 456, height: 80, min: 0, max: 100,
    step: 5, unit: W, value: 0}
  fan: {kind: switch, bind: fan.value, title: Fan, x: 488, y: 16, width: 224, height: 80}
  calibrate: {kind: button, bind: calibrate.trigger, title: Calibrate to 21 °C, x: 720, y: 16, width: 224, height: 80}
  temperature: {kind: number, bind: temperature.out, title: Temperature, x: 16, y: 112, width: 224, height: 80, unit: °C,
    digits: 3}
  humidity: {kind: number, bind: humidity.out, title: Humidity, x: 256, y: 112, width: 224, height: 80, unit: '%', digits: 3}
  offset: {kind: number, bind: calibrate.result, title: Sensor offset, x: 488, y: 112, width: 224, height: 80, unit: °C}
  chart: {kind: chart, bind: temperature.out, title: Temperature, x: 16, y: 208, width: 928, height: 272, unit: °C}
