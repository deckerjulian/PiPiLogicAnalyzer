panel: Long-term logger
flow: ../flows/logger.flow.yaml
width: 960
height: 400
widgets:
  duty: {kind: slider, bind: pwm.duty, title: PWM of D9, x: 16, y: 16, width: 224, height: 80, min: 0, max: 1, step: 0.05,
    value: 0.4}
  volts: {kind: number, bind: monitor.A0, title: A0, x: 488, y: 16, width: 224, height: 80, unit: V}
  button: {kind: led, bind: monitor.D2, title: Button D2, x: 720, y: 16, width: 224, height: 80, threshold: 0.5}
  chart: {kind: chart, bind: monitor.A0, title: A0 over time, x: 16, y: 112, width: 928, height: 272, unit: V}
