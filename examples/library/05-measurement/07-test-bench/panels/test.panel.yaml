panel: Test bench
flow: ../flows/test.flow.yaml
width: 960
height: 400
widgets:
  run: {kind: button, bind: uart_capture.arm, title: Run the tests, x: 16, y: 16, width: 296, height: 80}
  uart: {kind: led, bind: uart_check.result, title: UART, x: 16, y: 112, width: 296, height: 80}
  clock: {kind: led, bind: clock_check.pass, title: Clock, x: 328, y: 112, width: 296, height: 80}
  frequency: {kind: number, bind: frequency.out, title: Clock frequency, x: 648, y: 112, width: 296, height: 80, unit: Hz}
  trace: {kind: scope, bind: uart_capture.capture, title: UART, x: 16, y: 208, width: 928, height: 176}
