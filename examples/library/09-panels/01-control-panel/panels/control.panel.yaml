panel: Control panel
flow: ../flows/control.flow.yaml
width: 960
height: 304
tabs: ['', Chart]
widgets:
  title: {kind: label, x: 16, y: 16, width: 928, height: 80, text: Arduino Uno}
  duty: {kind: slider, bind: pwm.duty, title: PWM of D9, x: 16, y: 112, width: 456, height: 80, min: 0, max: 1, step: 0.05,
    value: 0.5}
  led: {kind: switch, bind: led.value, title: LED D13, x: 488, y: 112, width: 224, height: 80}
  volts: {kind: number, bind: monitor.A0, title: A0, x: 16, y: 208, width: 224, height: 80, unit: V, digits: 3}
  d2: {kind: led, bind: monitor.D2, title: D2, x: 256, y: 208, width: 224, height: 80}
  d13: {kind: led, bind: monitor.D13, title: D13, x: 488, y: 208, width: 224, height: 80}
  chart: {kind: chart, bind: monitor.A0, title: A0 over time, x: 16, y: 16, width: 928, height: 272, tab: Chart, unit: V}
