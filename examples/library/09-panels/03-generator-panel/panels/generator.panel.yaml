panel: Generator panel
flow: ../flows/generator.flow.yaml
width: 960
height: 496
widgets:
  frequency: {kind: slider, bind: generator.frequency, title: Frequency, x: 16, y: 16, width: 456, height: 80, min: 100, max: 20000,
    step: 100, unit: Hz, value: 1000}
  amplitude: {kind: slider, bind: generator.amplitude, title: Amplitude, x: 488, y: 16, width: 456, height: 80, min: 0.1,
    max: 4, step: 0.1, unit: V, value: 1}
  capture: {kind: button, bind: capture.arm, title: Capture, x: 16, y: 112, width: 224, height: 80}
  rms: {kind: number, bind: rms.out, title: RMS, x: 256, y: 112, width: 224, height: 80, unit: V, digits: 3}
  measured: {kind: number, bind: frequency.out, title: Frequency, x: 488, y: 112, width: 224, height: 80, unit: Hz, digits: 5}
  trace: {kind: scope, bind: capture.capture, title: CH1, x: 16, y: 208, width: 928, height: 272}
