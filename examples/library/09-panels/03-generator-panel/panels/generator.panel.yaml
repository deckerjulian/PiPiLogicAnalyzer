panel: Generator panel
flow: ../flows/generator.flow.yaml
columns: 4
widgets:
  frequency: {kind: slider, bind: generator.frequency, title: Frequency, columns: 2, min: 100, max: 20000, step: 100,
    unit: Hz, value: 1000}
  amplitude: {kind: slider, bind: generator.amplitude, title: Amplitude, column: 2, columns: 2, min: 0.1, max: 4,
    step: 0.1, unit: V, value: 1}
  capture: {kind: button, bind: capture.arm, title: Capture, row: 1}
  rms: {kind: number, bind: rms.out, title: RMS, row: 1, column: 1, unit: V, digits: 3}
  measured: {kind: number, bind: frequency.out, title: Frequency, row: 1, column: 2, unit: Hz, digits: 5}
  trace: {kind: scope, bind: capture.capture, title: CH1, row: 2, columns: 4, rows: 3}
