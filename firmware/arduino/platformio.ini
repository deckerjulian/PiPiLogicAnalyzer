; openSciLab Arduino firmware (docs/protocols.md, "Arduino firmware (protocol 1)").
;
;   pio run                      build every board (firmware/build_all.sh --arduino does this)
;   pio run -e uno -t upload     build and flash one board
;   pio test -e native           the hardware-free tests (protocol, runs, dispatcher on a fake board)
;
; Each board environment sets -D FW_BOARD_<name>: src/board_config.h (memory) and the pin table
; in src/arch/<architecture>/ follow from it.

[platformio]
default_envs = uno, nano, megaatmega2560, uno_r4_minima, esp32dev, esp32-s3

[avr]
platform = atmelavr@^5
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:uno]
extends = avr
board = uno
build_flags = ${avr.build_flags} -D FW_BOARD_UNO

[env:nano]
extends = avr
; the Nano with the current (Optiboot) bootloader; old ones: nanoatmega328
board = nanoatmega328new
build_flags = ${avr.build_flags} -D FW_BOARD_NANO

[env:megaatmega2560]
extends = avr
board = megaatmega2560
build_flags = ${avr.build_flags} -D FW_BOARD_MEGA2560

[env:uno_r4_minima]
platform = renesas-ra@^1
framework = arduino
board = uno_r4_minima
monitor_speed = 2000000
build_flags = -D FW_BOARD_UNO_R4

[esp32]
platform = espressif32@^7
framework = arduino
monitor_speed = 2000000

[env:esp32dev]
extends = esp32
board = esp32dev
build_flags = -D FW_BOARD_ESP32

[env:esp32-s3]
extends = esp32
board = esp32-s3-devkitc-1
; the native USB port of the S3 (USB serial/JTAG, 303a:1001), not the UART bridge
build_flags = -D FW_BOARD_ESP32S3 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_build_src = yes
build_flags =
    -D FW_BOARD_NATIVE
    -std=gnu++11
    -Wall
    '-D FIXTURES_PATH="$PROJECT_DIR/../../tests/fixtures/arduino_frames.json"'
