; openSciLab Arduino benchmark (roadmap step 2a): measures what a board can do and prints one
; JSON line per run on the serial line. Not part of the firmware build or CI.
;
;   pio run -d firmware/arduino/benchmark -e uno -t upload
;   python firmware/arduino/benchmark/read_benchmark.py /dev/ttyACM0 115200

[platformio]
default_envs = uno, nano, megaatmega2560, uno_r4_minima, esp32dev, esp32-s3

[avr]
platform = atmelavr@^5
framework = arduino
monitor_speed = 115200
build_flags = -D BENCH_BAUD=115200

[env:uno]
extends = avr
board = uno

[env:nano]
extends = avr
board = nanoatmega328new

[env:megaatmega2560]
extends = avr
board = megaatmega2560

[env:uno_r4_minima]
platform = renesas-ra@^1
framework = arduino
board = uno_r4_minima
build_flags = -D BENCH_BAUD=2000000

[esp32]
platform = espressif32@^7
framework = arduino
build_flags = -D BENCH_BAUD=2000000

[env:esp32dev]
extends = esp32
board = esp32dev

[env:esp32-s3]
extends = esp32
board = esp32-s3-devkitc-1
build_flags = ${esp32.build_flags} -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
